server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches config/livewire.php's temporary_file_upload cap (50MB) plus
    # headroom — PHP's own upload_max_filesize/post_max_size (php.ini) are
    # the other half of this limit and must stay in sync.
    client_max_body_size 55M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built Vite assets and anything under public/storage — served directly
    # by nginx when the file actually exists on disk. Falls through to PHP
    # otherwise: Livewire and Flux both serve their own JS from dynamic,
    # per-request routes (e.g. /livewire-{hash}/livewire.min.js,
    # /flux/flux.min.js) that only PHP can generate — hard-404'ing on any
    # .js/.css path here broke both of them (and with them, every button on
    # the site, since neither Livewire nor Alpine ever loaded).
    location ~* \.(?:css|js|map|jpg|jpeg|png|gif|ico|webp|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
