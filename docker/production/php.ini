; Production overrides — merged on top of the php:8.4-fpm-alpine defaults.

; Matches config/livewire.php's temporary_file_upload.rules max:51200 (50MB,
; for direct video uploads). post_max_size must be a little larger than
; upload_max_filesize to leave room for the rest of the multipart request.
upload_max_filesize = 55M
post_max_size = 60M
max_execution_time = 300
max_input_time = 300

; Headroom for Intervention Image (GD) decoding/re-encoding large photos.
memory_limit = 256M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

session.gc_probability = 1
session.gc_divisor = 1000
